# Keep shared knobs in sync with BenchMARL/conf/anchor.yaml.

env_config:
  precision_target: 0.9
  coverage_target: 0.1

  # Quantile-position MDP: empty-rule start, leave-corner actions.
  # Training / FidCov use Track A empirical Fid P(ŷ=c | x in box).
  # Conditional CRN P(ŷ(z)=c) is Track B / instance evaluation only.
  precision_estimator: empirical
  n_perturb_train: 512
  n_perturb_eval: 256
  require_min_support_to_terminate: true
  quantile_eps: 0.001
  max_quantile_step: 0.10
  min_quantile_width: 0.02
  leave_threshold: 0.5
  max_new_constraints_per_step: 1
  activation_quantile: 0.05
  reset_diversity_frac: 0.3
  n_reset_landings: 2
  # Must equal the algorithm gamma: Ng shaping is policy-invariant only then.
  discount: 0.95
  sparsity_terminal_weight: 1.0
  require_precision_gain_to_terminate: true

  union_lift_k: 3.0

  use_perturbation: False
  perturbation_mode: "bootstrap"
  n_perturb: 2048

  min_width: 0.05
  initial_window: 0.1
  centroid_snap_threshold: 0.0
  strict_target_termination: true
  require_coverage_gain_to_terminate: true
  min_steps_before_termination: 2

  # Phi = alpha * precision + beta * sqrt(coverage) * gate(precision)
  alpha: 0.7
  beta: 0.25
  gamma: 0.1  # narrow-width overlap weight (not MDP discount)
  precision_blend_lambda: 1.0
  drift_penalty_weight: 0.05
  gate_margin: 0.10
  coverage_floor_penalty: 0.0
  coverage_floor_projection_steps: 6
  min_coverage_floor: 0.005
  coverage_floor_mode: terminal
  coverage_floor_relative: true
  terminal_bonus: 5.0
  partial_terminal_credit: 1.0
  use_class_aware_targets: true

  inter_class_overlap_weight: 0.0
  shared_reward_weight: 0.0
  global_coverage_weight: 0.0

  use_class_centroids: true
  cluster_centroids_per_class: null
  fixed_instances_per_class: null
  training_instance_ratio: 0.5
  use_adaptive_instance_ratios: true

  eval_on_test_data: false
  eval_split: val

  sparsity_width_ratio: 0.95
  ranking_score_formula: lcb_coverage
  top_k_rules_by_score: 5
  min_support: 10
  categorical_freeze: instance

  max_cycles: 50

logging_verbosity: "normal"
