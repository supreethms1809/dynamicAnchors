defaults:
  - masac_config
  - _self_

# Per-agent critics. A shared group Q would regress one prediction against n distinct rewards.
share_param_critic: False
num_qvalue_nets: 2
loss_function: "l2"
delay_qvalue: True
target_entropy: "auto"
discrete_target_entropy_weight: 0.2
alpha_init: 1.0
# min_alpha floors the SAC entropy temperature. With null it annealed to ~0.004
# by iter ~120, which removed entropy regularization and let one agent group's
# policy explode numerically (Q-loss -> 1e7, entropy -> 1e5, class-0 destroyed at
# iter 127). 0.01 keeps a small exploration/regularization floor; eval uses
# deterministic actions so this does not cost anything at inference.
min_alpha: 0.01
max_alpha: null
fixed_alpha: False
scale_mapping: "biased_softplus_1.0"
use_tanh_normal: True
coupled_discrete_values: True