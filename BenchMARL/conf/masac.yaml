defaults:
  - masac_config
  - _self_

# Per-agent critic heads over the group's joint (obs, action).
# TRUE builds ONE Q per group, shape (1,), expanded to every agent, while the
# reward stays per-agent shape (n_agents, 1) -- one prediction regressed against
# n_agents different targets, so the critic fits their mean and no agent gets its
# own credit. That was harmless while share_policy_params collapsed a class onto
# one network (identical agents, near-identical rewards); once the agents are
# genuinely distinct it is the binding constraint on learning.
# See docs/BUGS_mada_multiagent_design.md (M-04).
share_param_critic: False
num_qvalue_nets: 2
loss_function: "l2"
delay_qvalue: True
target_entropy: "auto"
discrete_target_entropy_weight: 0.2
alpha_init: 1.0
# min_alpha floors the SAC entropy temperature. With null it annealed to ~0.004
# by iter ~120, which removed entropy regularization and let one agent group's
# policy explode numerically (Q-loss -> 1e7, entropy -> 1e5, class-0 destroyed at
# iter 127). 0.01 keeps a small exploration/regularization floor; eval uses
# deterministic actions so this does not cost anything at inference.
min_alpha: 0.01
max_alpha: null
fixed_alpha: False
scale_mapping: "biased_softplus_1.0"
use_tanh_normal: True
coupled_discrete_values: True