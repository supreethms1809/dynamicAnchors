defaults:
  - _self_

task: "anchor"

# Passed into AnchorEnv.__init__(). Data fields are filled by the driver.
X_unit: null
X_std: null
y: null
feature_names: null
classifier: null
device: "cpu"
target_class: null
target_classes: null

env_config:
  precision_target: 0.9
  coverage_target: 0.1

  # Quantile-position MDP: empty-rule start, leave-corner actions.
  # Training / FidCov use Track A empirical Fid P(ŷ=c | x in box).
  # Conditional CRN P(ŷ(z)=c) is Track B / instance evaluation only.
  precision_estimator: empirical
  n_perturb_train: 512
  n_perturb_eval: 256
  require_min_support_to_terminate: true
  quantile_eps: 0.001
  max_quantile_step: 0.10
  min_quantile_width: 0.02
  leave_threshold: 0.5
  max_new_constraints_per_step: 1
  activation_quantile: 0.05
  reset_diversity_frac: 0.3
  n_reset_landings: 2
  # Must equal the algorithm gamma: Ng shaping is policy-invariant only then.
  discount: 0.95
  sparsity_terminal_weight: 1.0
  require_precision_gain_to_terminate: true
  gate_margin: 0.1
  partial_terminal_credit: 1.0
  coverage_floor_mode: terminal
  coverage_floor_relative: true
  # Class-level union floor: min(0.8 * τ_P, union_lift_k * class_prior).
  union_lift_k: 3.0
  # Empirical Fid on real rows in the box (cached classifier preds). Do not
  # re-enable "uniform"/"adaptive" perturbation for training precision.
  use_perturbation: False
  perturbation_mode: "bootstrap"
  n_perturb: 2048
  min_width: 0.05
  alpha: 0.7
  # Empty-rule start has C≈1; a large beta pays to keep the unit cube.
  beta: 0.25
  gamma: 0.1  # narrow-width overlap weight (not MDP discount)
  precision_blend_lambda: 1.0  # control uses hard Fid; softmax blend is logged only
  drift_penalty_weight: 0.05
  min_coverage_floor: 0.005
  terminal_bonus: 5.0
  # Paid once per class when the UNION of that class's boxes clears both targets.
  shared_terminal_bonus: 5.0
  use_class_aware_targets: true
  max_cycles: 50
  min_steps_before_termination: 2

  enable_stability_termination: true
  stability_window: 20
  stability_min_steps: 15
  stability_precision_tol: 1e-3
  stability_coverage_tol: 1e-3
  stability_drift_tol: 1e-3

  initial_window: 0.1
  centroid_snap_threshold: 0.0
  strict_target_termination: true
  require_coverage_gain_to_terminate: true
  # Simpson of this k>=1 claim vs other-class k>=1 union on D_active. Empty start claims nothing.
  inter_class_overlap_weight: 0.25
  # shared_reward_weight * (Phi_union(s') - Phi_union(s)), same precision gate as local Phi.
  shared_reward_weight: 0.5
  same_class_diversity_weight: 0.25
  global_coverage_weight: 0.01  # logging only
  global_coverage_threshold: 0.1
  compute_nashconv: false
  nashconv_threshold: 0.01
  agents_per_class: 3
  use_class_centroids: true
  cluster_centroids_per_class: null
  fixed_instances_per_class: null
  # Mix instance-based and class-centroid resets (same Fid objective on both).
  training_instance_ratio: 0.5
  use_adaptive_instance_ratios: true

  eval_on_test_data: false
  # Generate / select on D_val. Paper cells come from revision.evaluate on D_test.
  eval_split: val

  sparsity_width_ratio: 0.95
  ranking_score_formula: lcb_coverage
  top_k_rules_by_score: 5
  min_support: 10
  categorical_freeze: instance

logging_verbosity: "normal"

# Keep in sync with env_config.max_cycles (task wrapper may read the top-level key).
max_cycles: 50
